name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "backend/requirements*.txt" }
      - run: pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: ruff check app tests
      - run: pytest -q
        env: { AGENT_SHIELD_DISABLE_EMBEDDINGS: "1" }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
