services:
  agent-shield:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-shield-gateway
    ports:
      - "127.0.0.1:8000:8000"   # localhost only; put a TLS reverse proxy in front for anything else
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Secure by default. Set SECURITY_ENV=development in backend/.env for local demos.
      SECURITY_ENV: ${SECURITY_ENV:-production}
      DATABASE_URL: sqlite:////app/data/agentshield.db
    volumes:
      - ./sandbox:/app/sandbox
      - ./data:/app/data
      # users.json (API keys) is NOT in git: copy users.example.json -> users.json and edit.
      - ./backend/app/config:/app/app/config:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
